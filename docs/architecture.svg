<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="100%" height="100%">
  <defs>
    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
      <circle cx="30" cy="0" r="0.8" fill="rgba(56, 189, 248, 0.15)"/>
    </pattern>
  </defs>

  <style>
    .bg-main { fill: #030712; }
    .grid-layer { fill: url(#arch-grid); }
    
    .font-tech {
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', 'Courier New', monospace;
    }

    .title-strip {
      font-size: 10.5px;
      fill: rgba(56, 189, 248, 0.6);
      letter-spacing: 2px;
      font-weight: bold;
    }

    .node-title {
      font-size: 10.5px;
      font-weight: bold;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .node-subtext {
      font-size: 8.5px;
      fill: rgba(226, 232, 240, 0.65);
    }

    .node-tag {
      font-size: 8px;
      font-weight: bold;
      letter-spacing: 0.8px;
    }

    .conn-line {
      fill: none;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    .flow-arrow {
      fill: none;
      stroke-width: 1.5;
    }

    /* Animation for active flow lines */
    @keyframes flow-dash {
      to {
        stroke-dashoffset: -20;
      }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .flow-active {
      animation: flow-dash 1s linear infinite;
    }

    .live-dot {
      animation: pulse-dot 1s ease-in-out infinite;
    }
  </style>

  <!-- 1. BACKGROUND -->
  <rect class="bg-main" width="100%" height="100%"/>
  <rect class="grid-layer" width="100%" height="100%"/>
  <rect x="1" y="1" width="1078" height="238" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>

  <!-- 2. TOP HEADER DECORATION -->
  <line x1="0" y1="36" x2="1080" y2="36" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>
  <circle cx="25" cy="22" r="3" fill="#00f0ff" class="live-dot" filter="url(#glow-soft)"/>
  <text x="36" y="25" class="font-tech title-strip">ARQUITETURA DE CONTROLE E FLUXO DE TELEMETRIA // PYDRONE STACK</text>
  <text x="1055" y="25" class="font-tech title-strip" text-anchor="end" fill="rgba(56, 189, 248, 0.4)">PROTOCOL: ESP-NOW 2.4G</text>

  <!-- ==================== NODE 1: IMU SENSOR ==================== -->
  <g transform="translate(25, 60)">
    <polygon points="8,0 172,0 180,8 180,102 172,110 8,110 0,102 0,8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <rect x="12" y="14" width="4" height="12" fill="#38bdf8" />
    <text x="22" y="24" class="font-tech node-title">01. SENSOR 9-DOF</text>
    <text x="12" y="46" class="font-tech node-subtext">Módulo GY-91</text>
    <text x="12" y="60" class="font-tech node-subtext">MPU-9250 (Giro/Acel)</text>
    <text x="12" y="74" class="font-tech node-subtext">BMP280 (Barômetro)</text>
    <text x="12" y="96" class="font-tech node-tag" fill="#38bdf8">[ I2C @ 400kHz ]</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path class="conn-line flow-active" d="M 205,115 L 240,115" stroke="#38bdf8" />
  <path class="flow-arrow" d="M 235,110 L 240,115 L 235,120" stroke="#38bdf8" />

  <!-- ==================== NODE 2: AHRS FUSION ==================== -->
  <g transform="translate(240, 60)">
    <polygon points="8,0 172,0 180,8 180,102 172,110 8,110 0,102 0,8" fill="rgba(15, 23, 42, 0.8)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <rect x="12" y="14" width="4" height="12" fill="#00f0ff" />
    <text x="22" y="24" class="font-tech node-title">02. MADGWICK AHRS</text>
    <text x="12" y="46" class="font-tech node-subtext">Fusão por Quatérnios</text>
    <text x="12" y="60" class="font-tech node-subtext">Taxa Fixa @ 100Hz</text>
    <text x="12" y="74" class="font-tech node-subtext">Deadband &amp; Expo Map</text>
    <text x="12" y="96" class="font-tech node-tag" fill="#00f0ff">[ R / P / Y / THR ]</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path class="conn-line flow-active" d="M 420,115 L 455,115" stroke="#00f0ff" />
  <path class="flow-arrow" d="M 450,110 L 455,115 L 450,120" stroke="#00f0ff" />

  <!-- ==================== NODE 3: RF LINK (ESP-NOW) ==================== -->
  <g transform="translate(455, 60)">
    <polygon points="8,0 172,0 180,8 180,102 172,110 8,110 0,102 0,8" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
    <rect x="12" y="14" width="4" height="12" fill="#38bdf8" />
    <text x="22" y="24" class="font-tech node-title">03. RF ESP-NOW</text>
    <text x="12" y="46" class="font-tech node-subtext">Link P2P 2.4GHz</text>
    <text x="12" y="60" class="font-tech node-subtext">Pacote 14 Bytes Binário</text>
    <text x="12" y="74" class="font-tech node-subtext">Fallback: BLE NUS</text>
    <text x="12" y="96" class="font-tech node-tag" fill="#38bdf8">[ LATÊNCIA &lt; 10MS ]</text>
  </g>

  <!-- Flow 3 -> 4 -->
  <path class="conn-line flow-active" d="M 635,115 L 670,115" stroke="#00f0ff" />
  <path class="flow-arrow" d="M 665,110 L 670,115 L 665,120" stroke="#00f0ff" />

  <!-- ==================== NODE 4: FLIGHT CONTROLLER ==================== -->
  <g transform="translate(670, 60)">
    <polygon points="8,0 172,0 180,8 180,102 172,110 8,110 0,102 0,8" fill="rgba(15, 23, 42, 0.8)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#glow-soft)"/>
    <rect x="12" y="14" width="4" height="12" fill="#0ea5e9" />
    <text x="22" y="24" class="font-tech node-title">04. FLIGHT CONTROLLER</text>
    <text x="12" y="46" class="font-tech node-subtext">ESP32 Receiver Polling</text>
    <text x="12" y="60" class="font-tech node-subtext">Decodificador de Canais</text>
    <text x="12" y="74" class="font-tech node-subtext">Failsafe Timeout 200ms</text>
    <text x="12" y="96" class="font-tech node-tag" fill="#0ea5e9">[ WATCHDOG ATIVO ]</text>
  </g>

  <!-- Flow 4 -> 5 -->
  <path class="conn-line flow-active" d="M 850,115 L 885,115" stroke="#38bdf8" />
  <path class="flow-arrow" d="M 880,110 L 885,115 L 880,120" stroke="#38bdf8" />

  <!-- ==================== NODE 5: MOTOR MIXER ==================== -->
  <g transform="translate(885, 60)">
    <polygon points="8,0 172,0 180,8 180,102 172,110 8,110 0,102 0,8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <rect x="12" y="14" width="4" height="12" fill="#38bdf8" />
    <text x="22" y="24" class="font-tech node-title">05. MIXER &amp; ESCs</text>
    <text x="12" y="46" class="font-tech node-subtext">Geometria Quad-X</text>
    <text x="12" y="60" class="font-tech node-subtext">PWM / DShot Signals</text>
    <text x="12" y="74" class="font-tech node-subtext">Controle de Empuxo</text>
    <text x="12" y="96" class="font-tech node-tag" fill="#38bdf8">[ 4X MOTORES M1-M4 ]</text>
  </g>

  <!-- 3. BOTTOM DECAL TELEMETRY -->
  <line x1="20" y1="195" x2="1060" y2="195" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>
  <g class="font-tech node-subtext" fill="rgba(56, 189, 248, 0.45)">
    <text x="25" y="215">SYS_PIPELINE: ACTIVE</text>
    <text x="280" y="215">AHRS_CONVERGENCE: &lt;0.05 RAD</text>
    <text x="600" y="215">FAILSAFE_CUTOFF: 200MS</text>
    <text x="1055" y="215" text-anchor="end" fill="#38bdf8" font-weight="bold">LINK_STABILITY: 99.8%</text>
  </g>
</svg>
